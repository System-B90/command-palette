# Ported from Bluz's docs workflow, self-hosted runner included.
name: Deploy Documentation

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment to execute on'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - github-hosted

# Only allow one docs deployment at a time
concurrency:
  group: docs-deployment
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "node", "python"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # TypeDoc reads the sources through tsconfig, so the Node dependencies
      # (typescript, typedoc, the markdown plugin) have to be present before
      # mkdocs runs the plugin.
      - name: Install Node dependencies
        run: npm ci

      - name: Install Python doc tools
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-typedoc

      - name: Build documentation site
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: python -m mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "light"]') }}
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
