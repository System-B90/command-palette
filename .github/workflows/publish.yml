name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN is used.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (skip if version already on registry)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --provenance --access public
          fi

      # The apps install the whole @system-b90 scope from GitHub Packages (npm
      # configures registries per scope, not per package), so every release is
      # mirrored there as well.
      - name: Publish to GitHub Packages (skip if version already on registry)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          reg=https://npm.pkg.github.com
          auth="--//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}"
          if npm view "$name@$version" version --@system-b90:registry=$reg $auth >/dev/null 2>&1; then
            echo "$name@$version already on GitHub Packages, skipping"
          else
            npm pkg set publishConfig.registry=$reg
            npm pkg delete publishConfig.provenance
            npm publish --@system-b90:registry=$reg $auth
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
