# Mirrors Bluz's mkdocs setup so the docs read the same across the org. The
# TypeDoc plugin regenerates `docs/api/` from the TSDoc comments in `src/` at
# build time — that directory is generated, never edited by hand.
site_name: Command Palette
site_description: VSCode-style command palette for MUI apps — shared across System-B90 front-ends.
site_url: https://system-b90.github.io/command-palette/
repo_url: https://github.com/system-b90/command-palette
repo_name: system-b90/command-palette
copyright: Copyright &copy; 2026 System B90

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - typedoc:
      source: ./src
      tsconfig: ./tsconfig.json
      output_dir: api
      options: typedoc.json

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - Contributing Commands: commands.md
      - Language & Localisation: localisation.md
      - Ranking & Matching: ranking.md
      - Theming & RTL: theming.md
      - Accessibility: accessibility.md
      - Recipes: recipes.md
  - Reference:
      - Architecture: architecture.md
      - API Reference: api/index.md
  - Project:
      - Migrating from Bluz: migration.md
      - Contributing: contributing.md
